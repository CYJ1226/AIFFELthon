version: '3.8'

volumes:
  db_storage:

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: postgres
    restart: unless-stopped

    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8nthankyou
      - POSTGRES_DB=n8n

    ports:
      - "47147:5432"

    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U 'n8n' -d 'n8n'"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: shared_network
    external: true
